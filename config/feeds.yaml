# News sources. Verified 2026-09-16 with scripts/verify_feeds.py: every enabled feed returned
# HTTP 200, parsed, and had entries from the last 12 hours.
#
# Fields: name (outlet; feeds sharing a name are one outlet), url, region (US | IN | GLOBAL),
# weight (1-3, prominence), optional category_hint, enabled, aliases (other spellings of the
# outlet name, e.g. how Google News labels it).
#
# Weights are starting guesses; tune freely.

feeds:
  # --- Global ---
  - name: BBC
    url: https://feeds.bbci.co.uk/news/world/rss.xml
    region: GLOBAL
    weight: 3
    aliases: [BBC News]

  - name: Al Jazeera
    url: https://www.aljazeera.com/xml/rss/all.xml
    region: GLOBAL
    weight: 2
    aliases: [Al Jazeera English]

  - name: NPR
    url: https://feeds.npr.org/1004/rss.xml
    region: GLOBAL
    weight: 2

  - name: The Guardian
    url: https://www.theguardian.com/world/rss
    region: GLOBAL
    weight: 2

  # --- US ---
  - name: CNBC
    url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114
    region: US
    weight: 2

  - name: CNBC
    url: https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=20910258
    region: US
    weight: 2
    category_hint: Economy & Markets

  # Politico's main feed (politics-news.xml) had nothing newer than 18h at verification,
  # and economy/defense/energy were 21h-10 days stale. congress and playbook were current.
  - name: Politico
    url: https://rss.politico.com/congress.xml
    region: US
    weight: 2
    category_hint: Politics

  - name: Politico
    url: https://rss.politico.com/playbook.xml
    region: US
    weight: 2
    category_hint: Politics

  # Paywalled: headline + RSS description only.
  - name: The New York Times
    url: https://rss.nytimes.com/services/xml/rss/nyt/World.xml
    region: US
    weight: 3
    aliases: [NYT, New York Times]

