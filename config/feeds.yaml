  # --- Google News top stories (links are Google redirect URLs; outlet comes from the entry) ---
  - name: Google News US
    url: https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en
    region: US
    weight: 1

  - name: Google News India
    url: https://news.google.com/rss?hl=en-IN&gl=IN&ceid=IN:en
    region: IN
    weight: 1

  # --- Unofficial stand-ins via Google News search (off by default) ---
  # Reuters and AP publish no official RSS. These returned 100 entries/day at verification.
  - name: Reuters
    url: https://news.google.com/rss/search?q=site:reuters.com+when:1d&hl=en-US&gl=US&ceid=US:en
    region: GLOBAL
    weight: 3
    enabled: false

  - name: AP News
    url: https://news.google.com/rss/search?q=site:apnews.com+when:1d&hl=en-US&gl=US&ceid=US:en
    region: GLOBAL
    weight: 3
    aliases: [Associated Press, AP]
    enabled: false

  # Moneycontrol's official feeds (moneycontrol.com/rss/*.xml) have not updated in 2+ years and
  # its RSS index page returns 410 Gone. This unofficial search is the only working option.
  - name: Moneycontrol
    url: https://news.google.com/rss/search?q=site:moneycontrol.com+when:1d&hl=en-IN&gl=IN&ceid=IN:en
    region: IN
    weight: 2
    enabled: false
