timezone: Asia/Kolkata

llm:
  provider: gemini # gemini | anthropic; the API key comes from GEMINI_API_KEY / ANTHROPIC_API_KEY
  # Gemini model IDs, checked 2026-09-17 against ai.google.dev/gemini-api/docs/models and
  # /pricing: both are stable models whose standard tier lists input and output as
  # "Free of charge" on the free tier. Free-tier content is used to improve Google's products.
  summary_model: gemini-3.5-flash-lite # cheap: summaries + event extraction
  # The rerank is the only thing that uses this, and it runs on Flash-Lite too
  # (2026-09-22). gemini-3.6-flash is the strongest model this project can call -
  # gemini-3.8-flash and gemini-3.1-pro-preview have no quota here - but it failed 7 of 21
  # reranks with 503s, including the last two, and the Phase 5 quality gate found its
  # reasoning no better than Flash-Lite's. One flaky call a run is not worth a second model.
  reasoning_model: gemini-3.5-flash-lite # the rerank; see the note above
  # To use Anthropic instead: provider: anthropic, summary_model: claude-haiku-4-5,
  # reasoning_model: claude-sonnet-5, temperature: {claude-haiku-4-5: 0.2}, and set
  # ANTHROPIC_API_KEY. (claude-sonnet-5 rejects temperature, so leave it out.)
  #
  # Temperature per model ID; models not listed use their default.
  #
  # Set to 0 on 2026-09-21, against Google's advice for Gemini 3 (they suggest leaving it at
  # 1.0 because lower values can cause looping). Summaries and event extraction are
  # classification tasks, and run-to-run variance changed which playbook rules fired, which
  # pollutes the Phase 4 track record. No looping or truncation was seen in 40 extractions.
  #
  # This is per model, and summaries, event extraction and the LLM impact layer all use
  # flash-lite, so layer B is at 0 too. Its output is scored like any other call, so the same
  # argument applies; a per-call override would be needed to treat it differently.
  temperature: { gemini-3.5-flash-lite: 0 }
  # Temperature 0 on its own is not reproducible on Gemini: re-extracting the same 20
  # fixtures changed severity, channels or countries on 13 of them, which changes which
  # playbook rules fire. With this seed the same request returns the same answer.
  seed: 20260921
  timeout_seconds: 60
  max_retries: 3 # retries for timeouts, 429 and 5xx, with exponential backoff (max 60s wait)
  # Client-side limits per model ID, so runs never exceed the quota. Required for Gemini
  # models the pipeline calls. Values come from https://aistudio.google.com/rate-limit (Google's
  # docs don't publish them). Limits are per Google Cloud project, shared by all keys in it.
  # Daily requests reset at midnight Pacific time: 12:30 IST during US daylight time,
  # 13:30 IST otherwise. The daily count is tracked per Pacific day, not per IST day.
  rate_limits:
    gemini-3.5-flash-lite: # the user's project limits, provided 2026-09-17
      requests_per_minute: 15
      input_tokens_per_minute: 250000
      requests_per_day: 500
      # 70% of the quota for new work; the remaining 150 are kept for retries. When the budget
      # is used up, the rest of the run's summaries are skipped and done on a later run.
      requests_per_day_budget: 350
    # Kept although nothing calls this model now (the rerank moved to Flash-Lite on
    # 2026-09-22): make_llm_client refuses a Gemini model with no limits, so these have to
    # be here before it can ever be used again.
    gemini-3.6-flash: # the user's project limits, provided 2026-09-20
      requests_per_minute: 5
      input_tokens_per_minute: 250000
      requests_per_day: 20
      requests_per_day_budget: 15
  rate_limit_day_timezone: America/Los_Angeles

http:
  timeout_seconds: 10
  max_attempts: 3
  backoff_base_seconds: 1.0
  user_agent: "Mozilla/5.0 (compatible; Newsdesk/0.1; personal news reader)"

pipeline:
  lookback_hours: 12
  story_attach_window_hours: 36
  max_stories_per_run: 20
  # 15 general + 5 for stories only Indian outlets carry. Measured 2026-09-21: 0 of 524
  # India-only stories were summarized in 48h, because their importance tops out at 3.60
  # against a cutoff of 4.69. Inside max_stories_per_run, so it costs no LLM calls.
  reserved_slots: { IN: 5 }
  reserved_candidate_pool: 10
  reserved_max_age_hours: 48
  max_articles_per_story_for_llm: 5
  # The reasoning model reorders this many top stories by real-world significance
  # before summarizing (SPEC 7.4). It decides which stories are summarized and which
  # get an LLM impact call. If the call fails, the importance order is kept.
  rerank_candidates: 40
  snippet_max_chars: 500

dedupe:
  same_source_title_similarity: 90
  same_source_window_hours: 24
  syndication_title_similarity: 90

grouping:
  # Embedding grouping (moved up from Phase 5): each new article joins the story whose centroid
  # (mean embedding of its news articles) is most similar, if the cosine similarity is at least
  # embedding_threshold; otherwise it starts a story. Runs locally, no API calls.
  method: embedding
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  # Approved 2026-09-19. Tuned with scripts/embedding_report.py on 2,337 real articles
  # (Sept 16, 17 and 19): 0.55 is the only value that passes all four regression cases
  # (tests/fixtures/grouping_regressions.json) with the fewest topic blobs. 0.60+ splits the
  # House vote from India's reaction; 0.50 merges more unrelated same-topic articles.
  # Known weak spot: some same-topic, different-event merges just above 0.55 (market movers,
  # "India trade").
  embedding_threshold: 0.55
  # Anti-drift check (2026-09-19): an article must also score at least seed_threshold against
  # the story's seed, its earliest news article, or a story can chain into a topic blob one
  # loosely related article at a time (seen: NSE IPO -> other IPOs; UN war-crimes report ->
  # US troop-death reports). 0.45 is the highest value that keeps regression case (a): at
  # 0.47-0.50 India's reactions split off the sanctions-bill story. Cost at 0.45: stories
  # whose first article is unrepresentative can split (the Tata Sons chairman row split into
  # three). Remove the line (or set null) to disable.
  seed_threshold: 0.45
  # Every article whose best story match scores in this range, or that the seed check kept
  # out of its best story, is appended to data/logs/grouping_borderline.jsonl (titles,
  # scores, decision) for later retuning.
  borderline_log_range: [0.45, 0.65]
  # Title matcher: used only if the embedding model can't load.
  # Approved 2026-09-17 after reviewing sample groupings. Compared on a 24h sample of 786
  # articles with scripts/grouping_report.py: merges scoring ~62 were about half wrong; at 64,
  # 10 of 12 borderline merges were the same story and 2 were loose topic matches. Near misses
  # at 63-64 are mostly the same story (title-only matching's limit). The title+snippet blend
  # and token_sort scorers did worse. A 2026-09-17 sample of 15 real pairs scoring 58-72: 6 of 8
  # at >=64 were the same event (the other 2 were roundup/newsletter articles), 6 of 7 below 64
  # were the same event too. Raising the threshold wouldn't stop the roundups.
  scorer: title_token_set
  threshold: 64

ranking:
  w_sources: 1.0
  w_region_diversity: 0.8
  w_source_weight: 0.3
  w_recency: 0.5
  recency_half_life_hours: 12

impacts:
  max_impacts_per_story: 8
  # Price check (SPEC 7.8). A move counts as "already moved" (or "moving against this call")
  # once it reaches this multiple of the asset's typical daily move, measured as the standard
  # deviation of the last scoring.vol_lookback_days daily returns (daily point changes for
  # yields). This is NOT scoring.hit_threshold_vol_multiple: that one (0.5) decides whether a
  # call was right days later, this one (1.0) decides whether the news is already in the price.
  moved_vol_multiple: 1.0
  vol_min_returns: 10   # below this many usable daily returns, show the move without a label
  # If the newest bar is older than this, the data itself looks broken. It must be longer
  # than a normal closure: Friday close to Monday open is ~2.7 days, and a holiday Monday
  # makes it ~3.7, so 3 would flag healthy weekends.
  price_stale_days: 5
  # The LLM impact layer runs on the top stories of each run only: the digest shows 15
  # stories twice a day, so calls on the rest would buy little. 5 a run is 40 a day,
  # which keeps summaries + extraction + layer B inside the 350 budget on busy days.
  llm_max_stories_per_run: 5

scoring:
  horizons_trading_days: [1, 5]
  vol_lookback_days: 20
  # A call is a hit or a miss only if the excess return reaches this multiple of the asset's
  # daily volatility (times the square root of the horizon). Separate from
  # impacts.moved_vol_multiple (1.0), which is about whether the news is already priced in.
  hit_threshold_vol_multiple: 0.5
  # Hit rates are hidden below this many judged calls. Note n counts asset-calls, not
  # independent events: one story can produce a dozen correlated impacts.
  min_samples_to_show_rate: 5
  min_stories_to_show_rate: 3
  early_rate_below_stories: 10
  reference_grace_days: 7   # no reference price this long after the story: unscorable
  score_grace_days: 7       # extra days to wait for a horizon's data before giving up

schedule:
  # `newsdesk scheduler` runs the pipeline every N hours, on the hour. Runs line up with the
  # digest hours, so each digest goes out 30 minutes after a run (every 3 hours: 01, 04, 07,
  # 10, 13, 16, 19, 22 IST). Chosen 2026-09-19 for Phase 2, where every summary is followed by
  # an event-extraction call. Replaying real news with the current grouping gave these
  # summary-model calls/day (summaries + extractions), typical / busy: hourly 253 / 480,
  # every 2 hours 218 / 336, every 3 hours 206 / 272, against the 350 budget. Digests are
  # just as fresh: a run still happens 30 minutes before each one.
  pipeline_every_hours: 3
  # Daily scoring, after the US close (03:30 IST is 18:00 New York the evening before).
  score_time: "03:30"
  # A pipeline run that starts within this many minutes of the last one finishing is a
  # catch-up for a slot missed while the laptop was asleep, and is skipped: the next real run
  # re-fetches the same 12-hour window, so running three in a row only spends quota. Under the
  # 3-hour spacing, so a scheduled run is never mistaken for a catch-up. `--force` overrides.
  min_run_gap_minutes: 90

delivery:
  digest_times: ["07:30", "19:30"]
  max_stories_per_digest: 15
  # Impacts shown per story (first-order first, then by confidence); the rest are
  # listed as "+N more", so a story with a dozen playbook impacts stays readable.
  max_impacts_in_digest: 6
  breaking_alerts: false
  breaking_importance_threshold: 5.0
  # The alert is today's news and nothing older: a story that broke before this time is left
  # out however recently it was summarized (user, 2026-09-23), which is what keeps stories
  # days old out of it - the reserved slots and carried-over summaries surface those.
  # 22:00 rather than midnight, so the night's news is today's news (user, 2026-09-23): the
  # 22:00 pipeline run's stories reach the 07:30 digest instead of falling in the gap between
  # the evening digest and midnight. Null carries everything summarized since the last digest.
  day_starts_at: "22:00"

web:
  # The rail's watchlist: assets kept on the page whether or not a story called them. Symbols
  # must be in config/assets.yaml; anything else is dropped with a warning. This is only the
  # default the page loads with - "Edit watchlist" keeps a per-browser choice in the browser
  # itself, since the web app never writes to the database.
  watchlist: ["BZ=F", "GC=F", "HG=F", "INR=X"]
  watchlist_max: 12

paths:
  database: data/newsdesk.db
  log_dir: data/logs
