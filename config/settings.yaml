timezone: Asia/Kolkata

llm:
  provider: gemini # gemini | anthropic; the API key comes from GEMINI_API_KEY / ANTHROPIC_API_KEY
  # Gemini model IDs, checked 2026-09-17 against ai.google.dev/gemini-api/docs/models and
  # /pricing: both are stable models whose standard tier lists input and output as
  # "Free of charge" on the free tier. Free-tier content is used to improve Google's products.
  summary_model: gemini-3.5-flash-lite # cheap: summaries + event extraction
  reasoning_model: gemini-3.8-flash # stronger: impact mapping, reranking (Phase 5)
  # To use Anthropic instead: provider: anthropic, summary_model: claude-haiku-4-5,
  # reasoning_model: claude-sonnet-5, temperature: {claude-haiku-4-5: 0.2}, and set
  # ANTHROPIC_API_KEY. (claude-sonnet-5 rejects temperature, so leave it out.)
  #
  # Temperature per model ID; models not listed use their default. Google recommends keeping
  # Gemini 3 models at their default of 1.0 (lower values can cause looping), so none is set.
  temperature: {}
  timeout_seconds: 60
  max_retries: 3 # retries for timeouts, 429 and 5xx, with exponential backoff (max 60s wait)
  # Client-side limits per model ID, so runs never exceed the quota. Required for Gemini
  # models the pipeline calls. Values come from https://aistudio.google.com/rate-limit (Google's
  # docs don't publish them). Limits are per Google Cloud project, shared by all keys in it.
  # Daily requests reset at midnight Pacific time: 12:30 IST during US daylight time,
  # 13:30 IST otherwise. The daily count is tracked per Pacific day, not per IST day.
  rate_limits:
    gemini-3.5-flash-lite: # the user's project limits, provided 2026-09-17
      requests_per_minute: 15
      input_tokens_per_minute: 250000
      requests_per_day: 500
      # 70% of the quota for new work; the remaining 150 are kept for retries. When the budget
      # is used up, the rest of the run's summaries are skipped and done on a later run.
      requests_per_day_budget: 350
  rate_limit_day_timezone: America/Los_Angeles

http:
  timeout_seconds: 10
  max_attempts: 3
  backoff_base_seconds: 1.0
  user_agent: "Mozilla/5.0 (compatible; Newsdesk/0.1; personal news reader)"

pipeline:
  lookback_hours: 12
  story_attach_window_hours: 36
  max_stories_per_run: 20
  max_articles_per_story_for_llm: 5
  snippet_max_chars: 500

dedupe:
  same_source_title_similarity: 90
  same_source_window_hours: 24
  syndication_title_similarity: 90

grouping:
  # Approved 2026-09-17 after reviewing sample groupings. Compared on a 24h sample of 786
  # articles with scripts/grouping_report.py: merges scoring ~62 were about half wrong; at 64,
  # 10 of 12 borderline merges were the same story and 2 were loose topic matches. Near misses
  # at 63-64 are mostly the same story (title-only matching's limit). The title+snippet blend
  # and token_sort scorers did worse. A 2026-09-17 sample of 15 real pairs scoring 58-72: 6 of 8
  # at >=64 were the same event (the other 2 were roundup/newsletter articles), 6 of 7 below 64
  # were the same event too. Raising the threshold wouldn't stop the roundups.
  scorer: title_token_set
  threshold: 64

ranking:
  w_sources: 1.0
  w_region_diversity: 0.8
  w_source_weight: 0.3
  w_recency: 0.5
  recency_half_life_hours: 12

impacts:
  max_impacts_per_story: 8

scoring:
  horizons_trading_days: [1, 5]
  vol_lookback_days: 20
  hit_threshold_vol_multiple: 0.5
  min_samples_to_show_rate: 5

schedule:
  # `newsdesk scheduler` runs the pipeline every N hours, on the hour. Runs line up with the
  # digest hours, so each digest goes out 30 minutes after a run. Chosen 2026-09-17: hourly is
  # the most frequent schedule that stays under the 350/day budget. Replaying real news gave
  # about 160 summary calls/day typical and about 260 busy. Phase 2 roughly doubles that (one
  # event extraction per summary), so revisit this then.
  pipeline_every_hours: 1

delivery:
  digest_times: ["07:30", "19:30"]
  max_stories_per_digest: 15
  breaking_alerts: false
  breaking_importance_threshold: 5.0

paths:
  database: data/newsdesk.db
  log_dir: data/logs
