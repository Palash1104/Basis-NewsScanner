# Asset universe (SPEC §8): every symbol the playbook (and, in Phase 5, the LLM impact layer)
# may use. Symbols are Yahoo Finance tickers, all from the SPEC §8 starter list.
#
# Every symbol must pass `uv run newsdesk validate-tickers` (5 days of daily prices from Yahoo).
# Failures are shown to the user; never replace a failing symbol with a guessed one.
#
# Fields:
#   symbol, name, display_name
#   type:    commodity | fx | rate | index | stock | etf
#   country: where the asset is listed or based ("Global" for commodities)
#   sector:  exactly one of Energy, Metals, Agriculture, Financials, Technology, Pharma,
#            Consumer, Industrials, Utilities, Real Estate, Telecom, Transport, Defence, Macro
#   tags:    exposure labels (from the SPEC §8 groupings)
#   exchange, currency, timezone: Yahoo's exchange code, currency and exchange time zone,
#            copied from the validate-tickers report (verified, never guessed). validate-tickers
#            flags any later mismatch. The scoring benchmark is chosen by exchange, and the time
#            zone is what makes "N trading days later" exact per exchange (SPEC 7.9).
#   up_means: optional plain-words meaning of "up", where an arrow is easy to misread.
#   approved_yahoo_names: Yahoo names the user confirmed are this asset, when Yahoo's wording
#            is too different for the automatic name check (validate-tickers stops flagging).
assets:
