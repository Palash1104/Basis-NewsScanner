# The watchlist: one list for stocks and commodities (user, 2026-10-07).
#
# Stocks get the fast news scan, filings and alerts. Commodities get a price card and the
# playbook impacts that touch them, nothing else, so they carry no aliases and must already
# be in config/assets.yaml.
#
# Fields (stocks):
#   symbol     the Yahoo ticker. All eight below verified on Yahoo and NSE on 2026-10-07.
#   nse_name   exactly as NSE writes the company in its announcements feed, which has no
#              symbol column - this is how NSE filings are matched.
#   isin       how BSE filings are matched (they arrive through the PEAD tool, keyed by ISIN).
#              A split or bonus gives a company a new ISIN: PFOCUS, APOLLO, HAL and BDL were
#              updated on 2026-10-17 to the ones NSE's and BSE's own lists give. BASIS also
#              matches filings on what those lists say today, so a stale one is no longer missed.
#   bse_code   BSE's scrip code, for a stock added from the page; filings are matched on it too.
#   aliases
#     strong   in the headline, enough alone: full names, distinctive brands, subsidiaries,
#              founders, and the NSE symbol where it is distinctive.
#     weak     short or shared names; they count only with a market word (shares, order,
#              results...) or one of the stock's own `vocab` words in the headline or snippet.
#   exclude    other things that contain an alias ("Tejas Networks" is not HAL's Tejas).
#   stop       regexes for a weak alias used as an ordinary word. None needed yet.
#
# Every alias was checked against real headlines; `scripts/watch_alias_review.py` re-runs that
# check and writes every keep and drop to data/watch_alias_review.md. Run it after any edit.

# Peer groups: stocks that move together. The price-move alert checks the group before
# blaming one stock, and scoring judges a group's stocks against its index as well as the
# Nifty, so a sector rally doesn't make every positive call look right (user, 2026-10-08).
groups:
  defence:
    name: Defence
    # Verified 2026-10-08: Yahoo's INDEX "NIFTY IND DEFENCE"; its previous close (9,215.35)
    # matched NSE's own figure for NIFTY INDIA DEFENCE exactly. Yahoo has no daily bars for
    # it, only today's: hourly bars go back to Nov 2024, so session closes come from those.
    index: NIFTY_IND_DEFENCE.NS

watchlist:
  - type: stock
    symbol: PFOCUS.NS
    name: Prime Focus
    nse_symbol: PFOCUS
    nse_name: Prime Focus Limited
    isin: INE367G01038
    aliases:
      # Brahma AI is the venture it backs: 22 headlines in 30 days, nearly all funding and
      # valuation news. "Ramayana" alone is the epic, not the company.
      strong: [Prime Focus, Brahma AI, PFOCUS]
      # DNEG is its VFX subsidiary and Namit Malhotra its founder, the "Ramayana producer" of
      # the I-T raid coverage. Both were strong at first, and pulled in VFX trade press
      # ("VFX breakdown by DNEG for 'Coyote Vs. ACME'") and film gossip ("Namit Malhotra
      # Images, HD Wallpapers") - so they now need a market word: raid, shares, crore...
      weak: [DNEG, Namit Malhotra]

  - type: stock
    symbol: APOLLO.NS
    group: defence
    name: Apollo Micro Systems
    nse_symbol: APOLLO
    nse_name: Apollo Micro Systems Limited
    isin: INE713T01028
    aliases:
      # Never "Apollo" alone: Apollo Hospitals, Apollo Tyres and Apollo Global took 20 of 100
      # "Apollo" headlines in a week. The NSE symbol is the bare word too, so it is left out.
      strong: [Apollo Micro Systems, Apollo Micro]

  - type: stock
    symbol: HAL.NS
    group: defence
    name: HAL
    nse_symbol: HAL
    nse_name: Hindustan Aeronautics Limited
    isin: INE066F01020
    aliases:
      # HATSOFF is its helicopter-training JV ("HAL to acquire full stake in HATSOFF").
      strong: [Hindustan Aeronautics, HATSOFF]
      # Tejas is HAL's fighter: 27 headlines in 30 days, many never naming HAL
      # ("GE Aerospace ships 4 more F404 engines for Tejas").
      weak: [HAL, Tejas]
    vocab: [aircraft, jet, fighter, LCA, IAF, Air Force, helicopter, Dhruv, Prachand, LCH, LUH,
            HTT-40, HTT 40, Su-30MKI, Sukhoi, engine, aero-engine, F404, F414, AL-31FP, Shakti,
            trainer, training, Mk1A, Mk2, AMCA, Koraput, aerospace, defence, Rajnath]
    # HAL SC is the company's football club: "Hindustan Aeronautics Limited SC" (Transfermarkt)
    # was the scanner's first live pass's one false keep, 2026-10-08.
    exclude: [Tejas Networks, Tejas Express, Hindustan Aeronautics Limited SC, HAL SC]
    # Air exercises and flypasts fly Tejas often - 25 headlines in 30 days, "Japan air chief
    # flies Tejas" among them - and none is HAL's business.
    noise: [sortie, exercise, Veer Guardian, Tarang Shakti, formation, air show, airshow,
            flypast,
            # HAL is also Halliburton's NYSE ticker: "Baker Hughes (BKR) vs. SLB and HAL: Can
            # IET Growth and LNG Demand Drive..." reached the 2026-10-15 digest as HAL news.
            Halliburton, SLB, Schlumberger, Baker Hughes, BKR, oilfield, NYSE]

